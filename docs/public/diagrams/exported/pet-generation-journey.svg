<svg width="1400" height="440" viewBox="0 0 1400 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-title diagram-desc" preserveAspectRatio="xMidYMid meet">
  <title id="diagram-title">AI 宠物制作与验收</title>
  <desc id="diagram-desc">先验收母版透明背景，再生成表情；图片完成后仍需保存浮窗外观配置</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111F"/><stop offset=".55" stop-color="#111C35"/><stop offset="1" stop-color="#17143A"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#C7D2FE" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-25%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".38"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60A5FA"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#34D399"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FB923C"/></marker>
  </defs>
  <rect width="1400" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="440" rx="28" fill="url(#grid)"/>
  <text x="52" y="58" fill="#F8FAFC" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="760">AI 宠物制作与验收</text>
  <text x="52" y="88" fill="#94A3B8" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">先验收母版透明背景，再生成表情；图片完成后仍需保存浮窗外观配置</text>
  <path d="M220 210 C240 210,240 210,260 210" stroke="#60A5FA" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

<path d="M445 210 C465 210,465 210,485 210" stroke="#60A5FA" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

<path d="M670 210 C690 210,690 210,710 210" stroke="#FB923C" stroke-width="2.2" fill="none" marker-end="url(#arrowOrange)"/>

<path d="M895 210 C915 210,915 210,935 210" stroke="#60A5FA" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

<path d="M1120 210 C1140 210,1140 210,1160 210" stroke="#34D399" stroke-width="2.2" fill="none" marker-end="url(#arrowGreen)"/>

<g filter="url(#shadow)">
    <rect x="35" y="165" width="185" height="90" rx="18" fill="#0D2A47" stroke="#38BDF8" stroke-opacity=".68"/>

    <text x="127.5" y="208" text-anchor="middle" fill="#E0F2FE" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="720">上传参考照片</text>
    <text x="127.5" y="234" text-anchor="middle" fill="#7DD3FC" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5">选择画风与要求</text>
  </g>
<g filter="url(#shadow)">
    <rect x="260" y="165" width="185" height="90" rx="18" fill="#2D1D46" stroke="#C084FC" stroke-opacity=".68"/>

    <text x="352.5" y="208" text-anchor="middle" fill="#FAF5FF" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="720">生成待机母版</text>
    <text x="352.5" y="234" text-anchor="middle" fill="#D8B4FE" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5">一次模型调用</text>
  </g>
<g filter="url(#shadow)">
    <rect x="485" y="165" width="185" height="90" rx="18" fill="#3A2416" stroke="#FB923C" stroke-opacity=".68"/>

    <text x="577.5" y="208" text-anchor="middle" fill="#FFF7ED" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="720">检查透明背景</text>
    <text x="577.5" y="234" text-anchor="middle" fill="#FDBA74" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5">清理 · 预览 · 确认</text>
  </g>
<g filter="url(#shadow)">
    <rect x="710" y="165" width="185" height="90" rx="18" fill="#1E2455" stroke="#818CF8" stroke-opacity=".68"/>

    <text x="802.5" y="208" text-anchor="middle" fill="#EEF2FF" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="720">设置表情区域</text>
    <text x="802.5" y="234" text-anchor="middle" fill="#A5B4FC" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5">选择表情生成方式</text>
  </g>
<g filter="url(#shadow)">
    <rect x="935" y="165" width="185" height="90" rx="18" fill="#2D1D46" stroke="#C084FC" stroke-opacity=".68"/>

    <text x="1027.5" y="208" text-anchor="middle" fill="#FAF5FF" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="720">生成并检查四帧</text>
    <text x="1027.5" y="234" text-anchor="middle" fill="#D8B4FE" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5">按需只重试一张</text>
  </g>
<g filter="url(#shadow)">
    <rect x="1160" y="165" width="205" height="90" rx="18" fill="#0B352F" stroke="#34D399" stroke-opacity=".68"/>

    <text x="1262.5" y="208" text-anchor="middle" fill="#ECFDF5" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="720">保存外观配置</text>
    <text x="1262.5" y="234" text-anchor="middle" fill="#6EE7B7" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12.5">访客页面验收</text>
  </g>
<text x="52" y="328" fill="#CBD5E1" font-family="Inter, PingFang SC, sans-serif" font-size="14">母版或单张表情不满意时，可返回对应步骤修改；待确认的新图不会直接覆盖已发布表情。</text>
  <text x="1348" y="415" text-anchor="end" fill="#64748B" font-family="Inter, PingFang SC, sans-serif" font-size="11">AI 智能套件 · 0.4.x</text>
</svg>