server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 0.4.x patch releases share the continuously updated root documentation.
    # Preserve the already archived 0.4.3 files without exposing a separate site.
    location = /versions/0.4.3 { return 302 /; }
    location ^~ /versions/0.4.3/ { return 302 /; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
