name: Build and regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        foundation: ["1.1.1"]
    env:
      AI_SUITE_BUILD_SENTINEL: ai-suite-build-sentinel-do-not-ship
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.1.3"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with type checks and pet regression tests
        run: ./gradlew clean build -PfoundationTestVersion=${{ matrix.foundation }}
      - name: Verify browser environment isolation
        run: node ui/scripts/verify-build-env.mjs
      - name: Validate visitor scripts
        run: |
          node --check src/main/resources/static/js/chat-widget.js
          node --check src/main/resources/static/js/sticker-pet.js
          git diff --check
      - name: Save verified plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: plugin-ai-suite-${{ github.sha }}-foundation-${{ matrix.foundation }}
          path: build/libs/plugin-ai-suite-*.jar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
